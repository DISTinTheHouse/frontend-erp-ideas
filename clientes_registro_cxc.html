<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CxC - Alta de Cliente</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Theme Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Sky 500
                            600: '#0284c7', // Sky 600
                            700: '#0369a1', // Sky 700
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 15px rgba(14, 165, 233, 0.3)',
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Poppins', sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Smooth transitions */
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Input Focus Ring Animation */
        .input-group:focus-within label {
            color: #0ea5e9;
        }
    </style>

    <!-- Theme Logic -->
    <script>
            (function () {
                const root = document.documentElement;
                function applySystemTheme() {
                    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (isDark) {
                        root.classList.add('dark');
                        root.setAttribute('data-bs-theme', 'dark');
                    } else {
                        root.classList.remove('dark');
                        root.setAttribute('data-bs-theme', 'light');
                    }
                }
                applySystemTheme();
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
            })();
    </script>
</head>

<body
    class="bg-slate-50/80 dark:bg-[#0a0a0a] text-slate-900 dark:text-slate-100 min-h-screen pb-32 transition-colors duration-300">

    <!-- Header -->
    <header
        class="sticky top-0 z-50 w-full backdrop-blur-xl bg-white/90 dark:bg-black/80 border-b border-slate-200/80 dark:border-white/10 supports-[backdrop-filter]:bg-white/60">
        <div class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <a href="cxc_clientes.html"
                        class="group flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 dark:bg-white/10 text-slate-500 hover:bg-brand-500 hover:text-white transition-all duration-300 shadow-sm hover:shadow-glow">
                        <svg class="w-5 h-5 transform group-hover:-translate-x-0.5 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                            </path>
                        </svg>
                    </a>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 dark:text-white font-display tracking-tight">
                            Alta de Cliente
                        </h1>
                        <div class="flex items-center gap-2">
                            <span class="relative flex h-2 w-2">
                                <span
                                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                            </span>
                            <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Registro Nuevo</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button type="button" id="btnSave"
                        class="group relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-semibold text-white transition-all duration-200 bg-slate-900 dark:bg-white dark:text-black rounded-xl hover:bg-brand-600 dark:hover:bg-brand-400 dark:hover:text-white shadow-lg shadow-slate-900/20 hover:shadow-brand-500/30 hover:-translate-y-0.5 active:translate-y-0">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4">
                            </path>
                        </svg>
                        Guardar Cliente
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- 1. Identificación del Cliente (Hero Card) -->
        <section
            class="relative overflow-hidden bg-white dark:bg-zinc-900 rounded-[2rem] p-6 md:p-8 border border-slate-200 dark:border-white/5 shadow-soft dark:shadow-none group hover:border-brand-200 dark:hover:border-brand-900 transition-colors duration-300">
            <!-- Decorative Elements -->
            <div
                class="absolute top-0 right-0 w-96 h-96 bg-brand-500/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none">
            </div>
            <div
                class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2 pointer-events-none">
            </div>

            <div class="flex flex-col lg:flex-row gap-8 items-start relative z-10">
                <!-- Logo Upload -->
                <div class="shrink-0 relative">
                    <div
                        class="w-36 h-36 rounded-3xl bg-slate-50 dark:bg-black/20 border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center text-slate-400 transition-all hover:border-brand-500 hover:text-brand-500 hover:bg-brand-50/50 dark:hover:bg-brand-900/10 cursor-pointer overflow-hidden shadow-inner">
                        <svg class="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        <span class="text-[10px] font-bold uppercase tracking-widest opacity-70">Logotipo</span>
                    </div>
                </div>

                <!-- Main Info Inputs -->
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-6 w-full">
                    <div class="md:col-span-2 lg:col-span-3 input-group">
                        <label
                            class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Razón
                            Social</label>
                        <input type="text"
                            class="w-full bg-transparent border-b-2 border-slate-200 dark:border-slate-800 focus:border-brand-500 dark:focus:border-brand-500 px-1 py-2 text-3xl font-bold text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-700 outline-none transition-colors"
                            placeholder="Empresa S.A. de C.V.">
                    </div>

                    <div class="input-group">
                        <label
                            class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Cliente
                            (ID)</label>
                        <input type="text"
                            class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-medium text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white dark:focus:bg-black/40 transition-all placeholder-slate-400"
                            placeholder="Clave Única">
                    </div>

                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8 items-start">

            <!-- Left Column: Fiscal, Address -->
            <div class="xl:col-span-2 space-y-8">

                <!-- 2 & 3. Fiscal y Dirección -->

                    class="bg-white dark:bg-zinc-900 rounded-[2rem] border border-slate-200 dark:border-white/5 shadow-soft dark:shadow-none overflow-hidden hover:shadow-lg transition-shadow duration-300">
                    <div
                        class="px-8 py-5 border-b border-slate-100 dark:border-white/5 flex items-center gap-3 bg-slate-50/50 dark:bg-white/[0.02]">

                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                                </path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-display font-semibold text-slate-900 dark:text-white text-lg">Información
                                Fiscal y Domicilio</h3>
                            <p class="text-xs text-slate-500">Datos para facturación y ubicación</p>
                        </div>
                    </div>

                    <div class="p-8 space-y-8">
                        <!-- Datos Fiscales -->
                        <div>
                            <h4
                                class="text-[11px] font-bold text-indigo-500 uppercase tracking-wider mb-5 flex items-center gap-2">
                                <span class="flex h-2 w-2 relative">
                                    <span
                                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                                </span>
                                Datos Fiscales (SAT)
                            </h4>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">RFC</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-mono uppercase outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all placeholder-slate-300"
                                        placeholder="XAXX010101000">
                                </div>
                                <div class="md:col-span-2 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Régimen
                                        Fiscal</label>
                                    <select
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                        <option value="">Seleccionar...</option>
                                        <option value="601">601 - General de Ley Personas Morales</option>
                                        <option value="612">612 - Personas Físicas con Actividades Empresariales
                                        </option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">CURP</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-mono uppercase outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all placeholder-slate-300">
                                </div>
                            </div>
                        </div>

                        <div class="h-px bg-slate-100 dark:bg-white/5"></div>

                        <!-- Dirección -->
                        <div>
                            <h4
                                class="text-[11px] font-bold text-indigo-500 uppercase tracking-wider mb-5 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full border border-indigo-500"></span> Domicilio
                            </h4>
                            <div class="grid grid-cols-12 gap-5">
                                <div class="col-span-12 md:col-span-6 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Dirección
                                        (Calle)</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                                <div class="col-span-6 md:col-span-2 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">No.
                                        Ext</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                                <div class="col-span-6 md:col-span-2 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">No.
                                        Int</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                                <div class="col-span-12 md:col-span-2 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">C.P.</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-mono outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>

                                <div class="col-span-12 md:col-span-4 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Colonia</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                                <div class="col-span-12 md:col-span-4 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Delegación</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                                <div class="col-span-12 md:col-span-4 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Ciudad</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                                <div class="col-span-12 md:col-span-6 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Estado</label>
                                    <input type="text"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                                <div class="col-span-12 md:col-span-6 input-group">
                                    <label
                                        class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">País</label>
                                    <input type="text" value="México"
                                        class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Contact -->
            <div class="space-y-8">

                <!-- 4. Contacto -->
                <div
                    class="bg-white dark:bg-zinc-900 rounded-[2rem] border border-slate-200 dark:border-white/5 shadow-soft dark:shadow-none p-8 hover:shadow-lg transition-shadow duration-300">
                    <div class="flex items-center gap-3 mb-6">
                        <div
                            class="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-500/10 flex items-center justify-center text-sky-600 dark:text-sky-400 shadow-sm">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <h3 class="font-display font-semibold text-slate-900 dark:text-white text-lg">Datos de Contacto
                        </h3>
                    </div>
                    <div class="space-y-6">
                        <div class="input-group">
                            <label
                                class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Nombre
                                Contacto</label>
                            <input type="text"
                                class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all placeholder-slate-400"
                                placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="input-group">
                            <label
                                class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Correo
                                Electrónico</label>
                            <input type="email"
                                class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all placeholder-slate-400"
                                placeholder="contacto@cliente.com">
                        </div>
                        <div class="input-group">
                            <label
                                class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Sitio
                                Web</label>
                            <input type="url"
                                class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all placeholder-slate-400"
                                placeholder="www.cliente.com">
                        </div>
                        <div class="input-group">
                            <label
                                class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Teléfonos</label>
                            <input type="tel"
                                class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all">
                        </div>
                        <div class="input-group">
                            <label
                                class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Teléfono
                                2</label>
                            <input type="tel"
                                class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all">
                        </div>
                        <div class="input-group">
                            <label
                                class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-1 block transition-colors">Celular</label>
                            <input type="tel"
                                class="w-full bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Simple script to handle save button animation
        document.getElementById('btnSave').addEventListener('click', function () {
            const btn = this;
            const originalContent = btn.innerHTML;

            // Change state
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Guardando...`;
            btn.classList.add('opacity-75', 'cursor-wait');

            // Simulate save
            setTimeout(() => {
                btn.innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Guardado`;
                btn.classList.remove('bg-slate-900', 'dark:bg-white', 'hover:bg-brand-600', 'dark:hover:bg-brand-400');
                btn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'text-white');

                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('opacity-75', 'cursor-wait', 'bg-emerald-500', 'hover:bg-emerald-600', 'text-white');
                    btn.classList.add('bg-slate-900', 'dark:bg-white', 'hover:bg-brand-600', 'dark:hover:bg-brand-400');
                }, 2000);
            }, 1500);
        });
    </script>
</body>

</html>
